# config/full_experiment.yaml
# Complete configuration for exp-1 including all required run variations on
# CIFAR-10 with ResNet-18.  Hyper-parameters follow the paper’s setup.

experiments:
  # ------------------------------------------------------------------- #
  # 1) FULL – no sub-sampling
  # ------------------------------------------------------------------- #
  - id: "FULL"
    seed: 0
    dataset:
      name: "CIFAR10"
      params:
        root: "./data"
        train_fraction: 0.9
        batch_size: 128
    model:
      name: "RESNET18"
      params: {}
    training:
      epochs: 150
      batch_size: 128
    optimizer:
      name: "SGD"
      lr: 0.1
      momentum: 0.9

  # ------------------------------------------------------------------- #
  # 2) RANDOM – fixed 10 % random subset
  # ------------------------------------------------------------------- #
  - id: "RANDOM-10%"
    seed: 0
    dataset:
      name: "CIFAR10"
      params:
        root: "./data"
        train_fraction: 0.9
        batch_size: 128
        subset_fraction: 0.10
        subset_strategy: "random"
    model:
      name: "RESNET18"
      params: {}
    training:
      epochs: 150
      batch_size: 128
    optimizer:
      name: "SGD"
      lr: 0.1
      momentum: 0.9
    method_specific:
      algo: "RANDOM_SUBSET"
      params:
        fraction: 0.10

  # ------------------------------------------------------------------- #
  # 3) AUTOMATA – fixed 10 % GradMatch subset
  # ------------------------------------------------------------------- #
  - id: "AUTOMATA-10%"
    seed: 0
    dataset:
      name: "CIFAR10"
      params:
        root: "./data"
        train_fraction: 0.9
        batch_size: 128
        subset_fraction: 0.10
        subset_strategy: "gradmatch"
    model:
      name: "RESNET18"
      params: {}
    training:
      epochs: 150
      batch_size: 128
    optimizer:
      name: "SGD"
      lr: 0.1
      momentum: 0.9
    method_specific:
      algo: "AUTOMATA"
      params:
        fraction: 0.10

  # ------------------------------------------------------------------- #
  # 4) DyGraM-HPO – adaptive subset with τ decay
  # ------------------------------------------------------------------- #
  - id: "DyGraM-HPO"
    seed: 0
    dataset:
      name: "CIFAR10"
      params:
        root: "./data"
        train_fraction: 0.9
        batch_size: 128
        subset_fraction: 0.01  # initial fraction
        subset_strategy: "gradmatch_dynamic"
    model:
      name: "RESNET18"
      params: {}
    training:
      epochs: 150
      batch_size: 128
    optimizer:
      name: "SGD"
      lr: 0.1
      momentum: 0.9
    method_specific:
      algo: "DyGraM-HPO"
      params:
        tau_start: 0.2
        tau_end: 0.05
        K: 5

  # ------------------------------------------------------------------- #
  # 5) DyGraM-HPO-noDecay – adaptive subset with fixed τ
  # ------------------------------------------------------------------- #
  - id: "DyGraM-HPO-noDecay"
    seed: 0
    dataset:
      name: "CIFAR10"
      params:
        root: "./data"
        train_fraction: 0.9
        batch_size: 128
        subset_fraction: 0.01
        subset_strategy: "gradmatch_dynamic"
    model:
      name: "RESNET18"
      params: {}
    training:
      epochs: 150
      batch_size: 128
    optimizer:
      name: "SGD"
      lr: 0.1
      momentum: 0.9
    method_specific:
      algo: "DyGraM-HPO-noDecay"
      params:
        tau_fixed: 0.1
        K: 5

# NOTE  – Additional datasets (CIFAR-100, SST-2, YearPrediction) and ablations
#         can be appended analogously.  The core infrastructure already supports
#         them via preprocess.py & model.py.
